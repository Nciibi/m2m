[package]
name = "m2m"
version = "3.6.21"
description = "Peer-to-peer encrypted messenger for journalists and high-risk users"
authors = ["M2M Contributors"]
edition = "2021"

[lib]
name = "m2m_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Signed update channel (security roadmap §4). INERT until configured:
# `plugins.updater.endpoints` in tauri.conf.json must be non-empty and the
# release pubkey filled in — see docs/SIGNED-UPDATES.md.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto: pure-Rust RustCrypto stack (security roadmap §4 — migrated FROM
# the archived sodiumoxide/libsodium bindings). Byte-compatible with the
# previous wire/DB formats: Ed25519 + X25519 are curve math; XChaCha20-
# Poly1305-IETF layout is identical (24B nonce, 16B tag appended).
# Enforced by golden vectors captured from libsodium + RFC 8032/7748 tests.
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.2"

# HMAC for X3DH and Double Ratchet key derivation (HKDF is implemented
# in crypto.rs on top of HMAC-SHA256 per RFC 5869)
hmac = "0.12"
sha2 = "0.10"

# Serialization: MessagePack (compact, well-specified)
rmp-serde = "1"

# Async runtime for networking
tokio = { version = "1", features = ["full"] }

# Logging (structured, redaction-friendly)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Secure memory zeroization
zeroize = { version = "1", features = ["derive"] }

# UUID generation for message IDs
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Base64url encoding for invite links
base64 = "0.22"

# Rate limiting
governor = "0.6"

# Local storage (app-level encryption via sodiumoxide, no OpenSSL needed)
rusqlite = { version = "0.33", features = ["bundled"] }

# Argon2id for passphrase-based key derivation
argon2 = "0.5"

# Hex encoding for fingerprints
hex = "0.4"

# Random number generation
rand = "0.9"

# State machine
thiserror = "2"

# Lock-free concurrent hash map for rate limiting
dashmap = "6"

# SOCKS5 proxy for Tor integration
tokio-socks = "0.5"

# Dynamic library loading for platform-specific FFI (screen capture protection)
libloading = "0.8"

# Raw window handle for platform-specific window operations
raw-window-handle = "0.6"

# Process enumeration for capture-software detection (minimal feature set:
# "system" covers the process list; everything else stays disabled)
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "crypto_bench"
harness = false

[[example]]
name = "generate-identity"
path = "examples/generate-identity.rs"

[features]
default = []

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"       # Optimize for binary size over speed
panic = "abort"
overflow-checks = true
