# Pinned toolchain for reproducible builds (security roadmap §4).
#
# Every release binary MUST be built with exactly this toolchain version so
# that two independent builds of the same commit produce identical artifacts
# (same rustc → same codegen). Do not bump casually; bumping invalidates all
# previous build attestations.
[toolchain]
channel = "1.83.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
