[package]
name = "m2m-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone workspace: fuzzing needs nightly + sanitizer flags that must
# never leak into the main build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "macros"] }
m2m = { path = ".." }

[[bin]]
name = "frame_parser"
path = "fuzz_targets/frame_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_structs"
path = "fuzz_targets/wire_structs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "padding"
path = "fuzz_targets/padding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dht_parser"
path = "fuzz_targets/dht_parser.rs"
test = false
doc = false
bench = false
