# GENERATED BY check.sh — DO NOT EDIT.
# Derived from src-tauri/Cargo.toml; see that file for the source of truth.
#
# `autobins` and friends are off because only `lib.rs` and the modules it
# declares are copied — `main.rs` is the binary entry point and the harness is
# a lib-only crate.

[package]
name = "m2m_harness"
version = "0.0.0"
edition = "2021"
autobins = false
autotests = false
autoexamples = false
autobenches = false

# Standalone. Without this, cargo refuses to build it because the harness lives
# inside the repo's directory tree and so appears to be a missing workspace
# member. An empty table keeps it out of the real workspace entirely, so the
# app's dependency graph and lockfile are never affected by harness crates.
[workspace]

[lib]
name = "m2m_lib"
path = "src/lib.rs"

[dependencies]
tauri = { path = "../tauri_stub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
rmp-serde = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
governor = "0.6"
rusqlite = { version = "0.33", features = ["bundled"] }
argon2 = "0.5"
hex = "0.4"
rand = "0.9"
thiserror = "2"
dashmap = "6"
tokio-socks = "0.5"
libloading = "0.8"
raw-window-handle = "0.6"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }
