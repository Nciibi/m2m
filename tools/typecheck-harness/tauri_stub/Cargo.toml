[package]
name = "tauri"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only so `async_runtime::spawn_blocking` can hand back a real `JoinHandle`
# with the same shape the app awaits.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
