name: Release

# Build signed installers and publish a GitHub release when a version tag
# (v3.6.21, v4.0.0, ...) is pushed.
#
# Versioning contract: the tag MUST match the version in package.json,
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml (see CLAUDE.md).
#
# Signing (all optional — unsigned bundles are produced if secrets are absent):
#   - macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#              APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   - Windows: TAURI_SIGNING_PRIVATE_KEY is for updater signatures; Windows
#              code-signing requires a cert configured on the runner.
#   - Linux:   no signing required (packages are notarization-free).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            deps: "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsodium-dev"
          - platform: windows-latest
            deps: ""
          - platform: macos-latest
            deps: ""

    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      if: matrix.deps != ''
      run: ${{ matrix.deps }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install Frontend Dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify tag matches manifest version
      shell: bash
      # The header comment claims all three manifests are checked. Only
      # package.json was, so the other two could drift from the tag and the
      # release would ship a binary whose embedded version differs from the
      # artifact name. CLAUDE.md lists exactly these four as the places the
      # version lives, so all four are checked here.
      run: |
        set -euo pipefail
        TAG="${GITHUB_REF_NAME#v}"

        PKG=$(node -p "require('./package.json').version")
        CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
        CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
        RELAY=$(sed -n 's/^version = "\(.*\)"$/\1/p' relay-server/Cargo.toml | head -1)

        fail=0
        check() {
          if [ "$2" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match $1 version $2"
            fail=1
          fi
        }
        check "package.json"           "$PKG"
        check "src-tauri/tauri.conf.json" "$CONF"
        check "src-tauri/Cargo.toml"   "$CARGO"
        check "relay-server/Cargo.toml" "$RELAY"
        exit $fail

    - name: Build and Release
      uses: tauri-apps/tauri-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ── macOS signing / notarization (optional) ──
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # ── Updater signature key ──
        # Only relevant once the updater is re-enabled (see
        # docs/SIGNED-UPDATES.md): bundle.createUpdaterArtifacts is currently
        # false and the pubkey is a placeholder. While that is the case these
        # secrets are unused. `includeUpdaterJson: false` below means that even
        # with them set, any signature produced is discarded — set it to true in
        # the same commit that turns the updater on, or drop the secrets.
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: "M2M ${{ github.ref_name }}"
        releaseBody: "See the assets to download this version and install."
        releaseDraft: true
        prerelease: false
        includeUpdaterJson: false
