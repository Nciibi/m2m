name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Code Quality ───
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    # NOTE: `dtolnay/rust-toolchain@stable` does NOT honour
    # `src-tauri/rust-toolchain.toml` when run from the repo root, so this job
    # does not use the pinned 1.89.0 that `SECURITY-HARDENING.md` requires for
    # release builds. fmt/clippy on `stable` is stricter than on the pin, so a
    # green run here is still meaningful; it is not, however, evidence that the
    # *release* toolchain is clean. Fix by pointing at the pinned toolchain.

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt-get update
        # `libsodium-dev` was here from the pre-RustCrypto era. There has been
        # no libsodium in Cargo.toml since the migration to ed25519-dalek /
        # x25519-dalek / chacha20poly1305, so it only widens the supply chain.
        # `libayatana-appindicator3-dev` replaces `libappindicator3-dev`: Tauri 2
        # resolves the tray library via pkg-config and fails with "Can't detect
        # any appindicator library" against the older package.
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # The Cargo workspace root is the REPO root (Cargo.toml members =
        # src-tauri, relay-server). Pointing this at `src-tauri` made it look
        # for src-tauri/src-tauri, so the cache missed on every single run.
        workspaces: .

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install Frontend Dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint (ESLint)
      run: pnpm lint

    - name: Check Formatting (Rust)
      run: cargo fmt --all -- --check
      working-directory: src-tauri

    - name: Clippy (Rust)
      run: cargo clippy --all-targets -- -D warnings
      working-directory: src-tauri

    - name: Run Tests (Rust)
      run: cargo test
      working-directory: src-tauri

    - name: Cargo Audit (Rust dependency vulnerabilities)
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pnpm Audit (JS dependency vulnerabilities)
      run: pnpm audit --audit-level=high

    - name: Run Frontend Tests (with coverage gate)
      run: pnpm test:coverage

    - name: Build Frontend
      run: pnpm build

  # ─── Multi-Platform Build ───
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            deps: "sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsodium-dev"
          - platform: windows-latest
            args: ""
            deps: ""
          - platform: macos-latest
            args: ""
            deps: ""

    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      if: matrix.deps != ''
      run: ${{ matrix.deps }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install Frontend Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Tauri App
      uses: tauri-apps/tauri-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: m2m-${{ matrix.platform }}
        path: |
          src-tauri/target/release/bundle/**/*
        if-no-files-found: ignore
